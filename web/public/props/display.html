<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Furnace display (filming prop)</title>
<style>
  /* Filming prop for the demo video: open on a spare phone and place it where a furnace control
     board would be. ?code=EE0 shows a 7-segment code (Goodman-style); ?led=31 blinks a status LED
     3 times, pauses, then 1 time (Carrier-style). Fictional, no brand marks. */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b120e; overflow: hidden; }
  body { display: grid; place-items: center; font-family: -apple-system, system-ui, sans-serif; }
  .board {
    width: min(92vw, 92vh * 1.4); aspect-ratio: 1.4; border-radius: 3%;
    background: radial-gradient(120% 90% at 30% 20%, #1d4d34, #0f2c1e 70%);
    box-shadow: inset 0 0 0 2px #2c6a49, 0 30px 80px #000a;
    position: relative;
  }
  .trace { position: absolute; background: #2f7552; opacity: .55; border-radius: 2px; }
  .chip { position: absolute; background: #121614; border-radius: 4px; box-shadow: inset 0 0 0 1px #2a302d; }
  .window {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: 52%; aspect-ratio: 2.6; background: #160404; border-radius: 6px;
    box-shadow: inset 0 0 0 3px #2b0d0d, inset 0 0 30px #000;
    display: flex; align-items: center; justify-content: center; gap: 4%;
  }
  .digit { height: 72%; }
  .seg { fill: #3a0707; transition: fill .05s; }
  .seg.on { fill: #ff2a1f; filter: drop-shadow(0 0 6px #ff2a1f) drop-shadow(0 0 14px #ff2a1faa); }
  .off .seg.on { fill: #3a0707; filter: none; }
  .led {
    position: absolute; left: 50%; top: 46%; width: 9%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; background: #3a0707; box-shadow: inset 0 0 0 3px #1a0303;
  }
  .led.on { background: #ff3b2e; box-shadow: 0 0 20px #ff3b2e, 0 0 60px #ff3b2eaa, inset 0 0 0 3px #ff8a80; }
  .label { position: absolute; left: 50%; top: 70%; transform: translateX(-50%); color: #cfe3d6; opacity: .7;
           font: 600 clamp(10px, 2.2vw, 16px)/1 ui-monospace, monospace; letter-spacing: .2em; }
  .hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #9fb3a8;
          font-size: 13px; transition: opacity 1s; }
</style>
</head>
<body>
<div class="board" id="board">
  <div class="trace" style="left:8%;top:18%;width:30%;height:1.2%"></div>
  <div class="trace" style="left:62%;top:78%;width:28%;height:1.2%"></div>
  <div class="trace" style="left:12%;top:20%;width:1.2%;height:52%"></div>
  <div class="chip" style="left:10%;top:72%;width:16%;height:14%"></div>
  <div class="chip" style="left:74%;top:12%;width:14%;height:20%"></div>
  <div class="label" id="label"></div>
</div>
<div class="hint" id="hint">Filming prop · ?code=EE0 or ?led=31</div>
<script>
  const params = new URLSearchParams(location.search);
  const board = document.getElementById('board');
  const label = document.getElementById('label');
  setTimeout(() => (document.getElementById('hint').style.opacity = 0), 3000);

  // Segments a–g, standard layout.
  const SEGMENTS = { a: 'M14 4h44l-6 8H20z', b: 'M60 6l6 6v34l-6 4-6-4V14z', c: 'M60 54l6 4v34l-6 6-6-8V58z',
    d: 'M14 100h44l-6-8H20z', e: 'M12 54l6 4v34l-6 6-6-6V58z', f: 'M12 6l6 8v32l-6 4-6-4V12z', g: 'M18 52l6-5h24l6 5-6 5H24z' };
  const GLYPHS = { '0': 'abcdef', '1': 'bc', '2': 'abdeg', '3': 'abcdg', '4': 'bcfg', '5': 'acdfg', '6': 'acdefg',
    '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', E: 'adefg', F: 'aefg', H: 'bcefg', L: 'def', P: 'abefg', ' ': '' };

  function digit(ch) {
    const on = GLYPHS[ch] ?? '';
    return `<svg class="digit" viewBox="0 0 72 104">${Object.entries(SEGMENTS)
      .map(([k, d]) => `<path class="seg${on.includes(k) ? ' on' : ''}" d="${d}"/>`).join('')}</svg>`;
  }

  const led = params.get('led');
  if (led && /^\d{1,2}$/.test(led)) {
    // Carrier-style status LED: tens as N flashes, short pause, units as M flashes, long pause.
    const el = document.createElement('div');
    el.className = 'led';
    board.appendChild(el);
    label.textContent = 'STATUS';
    const [tens, units] = led.length === 2 ? [+led[0], +led[1]] : [0, +led[0]];
    const seq = [];
    for (let i = 0; i < tens; i++) seq.push([true, 250], [false, 250]);
    if (tens) seq.push([false, 700]);
    for (let i = 0; i < units; i++) seq.push([true, 250], [false, 250]);
    seq.push([false, 2000]);
    let i = 0;
    const step = () => { const [on, ms] = seq[i++ % seq.length]; el.classList.toggle('on', on); setTimeout(step, ms); };
    step();
  } else {
    // Goodman-style 7-segment display: the code flashes on, with a short dark gap between repeats.
    const code = (params.get('code') || 'EE0').toUpperCase().slice(0, 3).padStart(3, ' ');
    const win = document.createElement('div');
    win.className = 'window';
    win.innerHTML = [...code].map(digit).join('');
    board.appendChild(win);
    label.textContent = 'STATUS CODE';
    let on = true;
    const tick = () => { win.classList.toggle('off', !on); setTimeout(tick, on ? 1600 : 400); on = !on; };
    tick();
  }
  // Keep the screen awake where supported (otherwise set Auto-Lock to Never while filming).
  navigator.wakeLock?.request('screen').catch(() => {});
</script>
</body>
</html>
